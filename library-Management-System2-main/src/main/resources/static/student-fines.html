<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fines — Harvard International Library </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Student</div>
                <h1>My fines</h1>
            </div>
        </div>

        <div class="stat-grid" style="max-width:280px;">
            <div class="stat-card">
                <div class="label">Total pending</div>
                <div class="value danger" id="pending-total">—</div>
            </div>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Book</th><th>Created</th><th>Amount</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody id="fines-body">
                        <tr class="empty-row"><td colspan="5">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/student-fines.js"></script>
</body>
</html>
