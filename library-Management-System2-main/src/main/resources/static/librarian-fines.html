<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Management — Harvard International Library </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Librarian</div>
                <h1>Fine management</h1>
            </div>
        </div>

        <div class="pill-tabs">
            <button class="active" data-tab="pending">Pending</button>
            <button data-tab="all">All fines</button>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Student</th><th>Book</th><th>Created</th><th>Amount</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody id="fines-body">
                        <tr class="empty-row"><td colspan="6">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/librarian-fines.js"></script>
</body>
</html>
