<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Books — Harvard International Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Student</div>
                <h1>My books</h1>
            </div>
            <div class="page-actions">
                <a href="student-books.html" class="btn btn-accent">Search books</a>
            </div>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Book</th><th>Requested</th><th>Issue date</th>
                            <th>Due date</th><th>Return date</th><th>Status</th><th>Fine</th>
                        </tr>
                    </thead>
                    <tbody id="issues-body">
                        <tr class="empty-row"><td colspan="7">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/student-my-books.js"></script>
</body>
</html>
