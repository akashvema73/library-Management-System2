<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Requests — Harvard International Library </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Librarian</div>
                <h1>Issue requests</h1>
            </div>
            <div class="page-actions">
                <button class="btn btn-accent" id="direct-issue-btn">Direct issue (walk-in)</button>
            </div>
        </div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Student</th><th>Enrollment</th><th>Book</th><th>Requested on</th><th></th></tr></thead>
                    <tbody id="requests-body">
                        <tr class="empty-row"><td colspan="5">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-backdrop" id="direct-modal">
    <div class="modal">
        <div class="modal-head">
            <h3>Direct issue</h3>
            <button class="modal-close" id="close-modal">&times;</button>
        </div>
        <form id="direct-form">
            <div class="field">
                <label for="d-student">Student</label>
                <select id="d-student" required></select>
            </div>
            <div class="field">
                <label for="d-book">Book</label>
                <select id="d-book" required></select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Issue book</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/librarian-requests.js"></script>
</body>
</html>
