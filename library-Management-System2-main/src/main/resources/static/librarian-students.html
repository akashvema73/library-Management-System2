<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — Harvard International Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Librarian</div>
                <h1>Students</h1>
            </div>
        </div>

        <div class="card">
            <div class="field" style="max-width:340px; margin-bottom:16px;">
                <label for="f-keyword">Search students</label>
                <input type="text" id="f-keyword" placeholder="Name, email, enrollment number, department">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Enrollment</th><th>Department</th><th>Year/Sem</th><th>Email</th><th>Status</th></tr>
                    </thead>
                    <tbody id="students-body">
                        <tr class="empty-row"><td colspan="6">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/students-view.js"></script>
</body>
</html>
