<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books & Categories — Harvard International Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow" id="page-eyebrow">Librarian</div>
                <h1>Books & categories</h1>
            </div>
            <div class="page-actions">
                <button class="btn btn-outline" id="add-category-btn">Add category</button>
                <button class="btn btn-accent" id="add-book-btn">Add book</button>
            </div>
        </div>

        <div class="pill-tabs">
            <button class="active" data-tab="books">Books</button>
            <button data-tab="categories">Categories</button>
        </div>

        <div class="card" id="books-panel">
            <div class="field-row" style="margin-bottom:16px;">
                <div class="field">
                    <label for="f-keyword">Search</label>
                    <input type="text" id="f-keyword" placeholder="Title, author or ISBN">
                </div>
                <div class="field">
                    <label for="f-category">Category</label>
                    <select id="f-category"><option value="">All categories</option></select>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Copies</th><th></th></tr>
                    </thead>
                    <tbody id="books-body">
                        <tr class="empty-row"><td colspan="6">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" id="categories-panel" style="display:none;">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
                    <tbody id="categories-body">
                        <tr class="empty-row"><td colspan="3">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Book modal -->
<div class="modal-backdrop" id="book-modal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="book-modal-title">Add book</h3>
            <button class="modal-close" id="book-modal-close">&times;</button>
        </div>
        <form id="book-form">
            <input type="hidden" id="b-id">
            <div class="field-row">
                <div class="field"><label for="b-title">Title</label><input type="text" id="b-title" required></div>
                <div class="field"><label for="b-isbn">ISBN</label><input type="text" id="b-isbn" required></div>
            </div>
            <div class="field-row">
                <div class="field"><label for="b-author">Author</label><input type="text" id="b-author"></div>
                <div class="field"><label for="b-publisher">Publisher</label><input type="text" id="b-publisher"></div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="b-category">Category</label>
                    <select id="b-category" required></select>
                </div>
                <div class="field"><label for="b-language">Language</label><input type="text" id="b-language" placeholder="English"></div>
            </div>
            <div class="field-row">
                <div class="field"><label for="b-edition">Edition</label><input type="text" id="b-edition"></div>
                <div class="field"><label for="b-year">Publication year</label><input type="number" id="b-year"></div>
            </div>
            <div class="field-row">
                <div class="field"><label for="b-shelf">Shelf number</label><input type="text" id="b-shelf"></div>
                <div class="field"><label for="b-rack">Rack number</label><input type="text" id="b-rack"></div>
            </div>
            <div class="field-row">
                <div class="field"><label for="b-price">Price (₹)</label><input type="number" step="0.01" id="b-price"></div>
                <div class="field"><label for="b-copies">Total copies</label><input type="number" id="b-copies" min="1" required></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save book</button>
        </form>
    </div>
</div>

<!-- Category modal -->
<div class="modal-backdrop" id="category-modal">
    <div class="modal">
        <div class="modal-head">
            <h3>Add category</h3>
            <button class="modal-close" id="category-modal-close">&times;</button>
        </div>
        <form id="category-form">
            <div class="field"><label for="c-name">Name</label><input type="text" id="c-name" required></div>
            <div class="field"><label for="c-description">Description</label><textarea id="c-description" rows="3"></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save category</button>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/books-manage.js"></script>
</body>
</html>
