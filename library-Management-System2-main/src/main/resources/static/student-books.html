<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Books — Harvard International Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="lms-sidebar-slot"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="eyebrow">Student</div>
                <h1>Search books</h1>
            </div>
        </div>

        <div class="card">
            <div class="field-row">
                <div class="field">
                    <label for="f-keyword">Search</label>
                    <input type="text" id="f-keyword" placeholder="Title, author or ISBN">
                </div>
                <div class="field">
                    <label for="f-category">Category</label>
                    <select id="f-category"><option value="">All categories</option></select>
                </div>
                <div class="field">
                    <label for="f-available">Availability</label>
                    <select id="f-available">
                        <option value="false">All books</option>
                        <option value="true">Available only</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="book-grid" id="book-grid">
            <p class="loading-row">Loading books…</p>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/student-books.js"></script>
</body>
</html>
